[package]
name = "rust_audacity"
description = "A small Audacity-style audio editor written in Rust"
license = "MIT"
version = "0.2.0"
edition = "2024"
default-run = "rust_audacity"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
ebur128 = "0.1.10"
eframe = { version = "0.37.0", features = ["persistence"] }
hound = "3.5.1"
png = "0.18.1"
realfft = "3.5.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"

# Keep debug builds responsive: optimise dependencies and lightly optimise our code
# so the real-time audio callback doesn't glitch.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"

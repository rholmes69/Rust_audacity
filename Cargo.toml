[package]
name = "rust_audacity"
description = "A small Audacity-style audio editor written in Rust"
license = "MIT"
version = "0.8.0"
edition = "2024"
default-run = "rust_audacity"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
ebur128 = "0.1.10"
eframe = { version = "0.37.0", features = ["persistence"] }
flacenc = "0.5"
hound = "3.5.1"
id3 = "1"
mp3lame-encoder = "0.2"
png = "0.18.1"
realfft = "3.5.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }
vorbis_rs = "0.5"
# Third-party plugin hosting (VST3 and CLAP).
vst3 = "0.3"
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "params", "state", "gui", "audio-ports", "latency", "timer", "log"] }
libloading = "0.8"

[target.'cfg(any(windows, wincheck))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 3
lto = "thin"

# Keep debug builds responsive: optimise dependencies and lightly optimise our code
# so the real-time audio callback doesn't glitch.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
metaflac = "0.2"

[build-dependencies]
winresource = "0.1.34"

[lints.rust]
# `--cfg wincheck` type-checks the Windows-only code on other systems.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wincheck)"] }
